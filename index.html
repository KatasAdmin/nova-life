<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09121d"><title>НОВАЯ ЖИЗНЬ · v0.4</title><style>
:root{color-scheme:dark;--bg:#07111b;--panel:#111e2b;--line:#263748;--text:#edf3ff;--muted:#a6b7ce;--green:#35d59a;--blue:#578ef6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#274568 0,transparent 42%),linear-gradient(#091725,#060d15 65%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:15px}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.42;cursor:not-allowed}.wrap{max-width:700px;margin:auto;padding:14px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center}.crown{font-size:29px}.brand b{font-size:20px;letter-spacing:.4px}.muted,.sub{color:var(--muted)}.sub{font-size:12px}.clock{text-align:right;font-weight:750}.panel{background:linear-gradient(145deg,rgba(20,34,49,.97),rgba(11,21,32,.97));border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px #0002}.hero{background:linear-gradient(0deg,#0b1726e8,#0b1726c4),radial-gradient(circle at 75% 15%,#93b8da,#315e78 45%,#14263c 70%);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid #34506b}.hero-head{display:flex;gap:14px;align-items:center}.portrait{width:115px;min-width:115px;height:144px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#62798a,#172638 65%);font-size:74px;box-shadow:inset 0 0 0 1px #ffffff22}.hero-info{min-width:0;flex:1}.hero-info h1{font-size:21px;line-height:1.15;margin:0 0 7px;overflow-wrap:anywhere}.hero-info p{margin:5px 0;color:#c4d2e4}.tiny-row{display:flex;justify-content:space-between;gap:6px;padding:10px 0;border-bottom:1px solid #ffffff12;font-size:13px}.tiny-row:last-child{border:0}.tiny-row span:first-child{color:#a6bad2}.tiny-row strong{text-align:right}.money-grid,.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.money-card{min-width:0}.money-icon{font-size:30px}.money-value{font-size:26px;font-weight:850;color:#65ebbc;margin:7px 0}.money-value.gold{color:#f1c46a}.btn{border:1px solid #3b526c;background:#23354b;border-radius:11px;padding:11px 12px;font-weight:700}.btn.primary{background:linear-gradient(100deg,#087c58,#0bb47c);border-color:#12a67a}.btn.full{width:100%}.btn.small{padding:7px 10px;font-size:12px}.btn:active,.tile:active{transform:scale(.98)}.panel-title{font-weight:800;font-size:18px;margin:0 0 12px}.study{display:flex;gap:12px;align-items:flex-start}.big-icon{width:65px;height:65px;display:grid;place-items:center;border-radius:13px;font-size:34px;flex-shrink:0;background:#163e7a}.bar{height:10px;background:#263446;border-radius:99px;overflow:hidden;margin:11px 0}.bar>div{height:100%;background:linear-gradient(90deg,#0ab978,#47e1a3);border-radius:99px}.tile{width:100%;border:1px solid var(--line);background:linear-gradient(140deg,#18293a,#101d2a);border-radius:15px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left;min-height:91px}.tile-icon{width:57px;height:57px;display:grid;place-items:center;font-size:30px;border-radius:12px;flex-shrink:0}.tile b{display:block;font-size:16px}.tile small{display:block;color:var(--muted);margin-top:4px;font-size:12px}.tile .chev{margin-left:auto;color:#aec2dc}.news-photo{height:100px;width:125px;flex-shrink:0;border-radius:10px;background:linear-gradient(0deg,#1c3444,#87b1d6);position:relative;overflow:hidden}.news-photo:before{content:'🏛️';font-size:60px;position:absolute;bottom:-5px;left:22px}.news{display:flex;gap:12px}.news b{line-height:1.4}.news p{margin:6px 0;font-size:13px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0d1927f7;border-top:1px solid #2c4055;display:flex;justify-content:center;padding:7px 5px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.nav button{background:none;border:0;color:#a5b6d2;flex:1;max-width:140px;font-size:10px;padding:6px 2px}.nav button.active{color:#69a0ff;background:#1a2a40;border-radius:10px}.nav .ni{font-size:24px;display:block;margin-bottom:4px}.stat{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff14}.stat:last-child{border-bottom:0}.stat span{color:var(--muted)}.stat b{text-align:right}details{border-bottom:1px solid #ffffff19;padding:13px 0}summary{font-weight:750;cursor:pointer}input{width:100%;background:#081521;color:white;border:1px solid #41566d;border-radius:10px;padding:13px;margin:8px 0;font-size:16px}.item{padding:13px 0;border-bottom:1px solid #ffffff18}.item:last-child{border:0}.item h3{margin:0 0 6px;font-size:16px}.item p{font-size:13px;color:var(--muted);margin:6px 0 10px}.pill{font-size:11px;color:#73e5b7;background:#0b473c;padding:5px 9px;border-radius:9px}.toast{position:fixed;z-index:20;top:15px;left:50%;transform:translateX(-50%);background:#205946;border:1px solid #53caa2;padding:13px 17px;border-radius:13px;text-align:center;max-width:90%;box-shadow:0 10px 30px #0008}.caption{font-size:12px;color:#91a6bf}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{color:var(--muted);padding:14px 0}.warn{color:#f5c98c}.progress-note{color:#79e8b8;font-size:12px}@media(max-width:390px){.portrait{width:95px;min-width:95px;height:125px;font-size:61px}.hero-info h1{font-size:18px}.money-value{font-size:22px}.panel{padding:13px}.tile-icon{width:47px;height:52px;font-size:26px}.tile{padding:9px;gap:7px}.tile b{font-size:14px}}
</style></head><body><div id="app"></div><div id="nav" class="nav"></div><script>
'use strict';const KEY='nova_life_v03',EPOCH=Date.now(),DAY_MS=15*60*1000;const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Math.floor(n).toLocaleString('ru-RU')+' ₴';const jobs=[{name:'Курьер',pay:550,edu:0,rep:0},{name:'Продавец',pay:800,edu:0,rep:5},{name:'Офисный сотрудник',pay:1400,edu:1,rep:10},{name:'Менеджер',pay:2300,edu:2,rep:25},{name:'Директор',pay:4500,edu:3,rep:50}];const goods=[['Продукты',250,'Еда на каждый день'],['Одежда',900,'Обновить гардероб'],['Смартфон',6500,'Средство связи'],['Ноутбук',18000,'Для учёбы и работы'],['Велосипед',4500,'Личный транспорт'],['Автомобиль',180000,'Собственный автомобиль']];const edus=['Экономический колледж · 1 курс','Экономический колледж · 2 курс','Колледж окончен','Высшее образование'];let state=null,tab='home',toastTimeout;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x.name==='string'&&Array.isArray(x.owned)&&Array.isArray(x.transactions)?x:null}catch{return null}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function fresh(name){return{name,age:16,day:1,cash:3000,bank:0,education:0,study:0,job:-1,reputation:0,energy:100,owned:[],transactions:[],salaryEarned:0,startedAt:Date.now(),lastSettledDay:1,withdrawable:0}}function migrate(){if(!state)return;state.startedAt??=Date.now()-Math.max(0,(state.day||1)-1)*DAY_MS;state.lastSettledDay??=state.day||1;state.withdrawable??=0;state.owned??=[];state.transactions??=[];state.salaryEarned??=0;state.education??=0;state.study??=0;state.reputation??=0;state.job??=-1;state.cash??=3000;state.bank??=0;state.energy??=100}
function gameDay(){return 1+Math.max(0,Math.floor((Date.now()-state.startedAt)/DAY_MS))}function sync(){if(!state)return;migrate();const now=gameDay();const previous=state.lastSettledDay;const elapsed=Math.max(0,now-previous);if(elapsed){if(state.job>=0){const pay=jobs[state.job].pay*elapsed;state.cash+=pay;state.salaryEarned+=pay;record('Зарплата за '+elapsed+' дн.',pay)}state.energy=Math.min(100,state.energy+elapsed*25);state.lastSettledDay=now;state.day=now;state.age=16+Math.floor((now-1)/365);save()}else{state.day=now;state.age=16+Math.floor((now-1)/365)}}function record(label,amount){state.transactions.unshift({day:state.day,label,amount});state.transactions=state.transactions.slice(0,60)}function notify(message){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=message;document.body.append(d);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>d.remove(),2600)}function done(msg){save();render();if(msg)notify(msg)}function go(t){tab=t;render();scrollTo(0,0)}function stat(a,b){return `<div class="stat"><span>${a}</span><b>${b}</b></div>`}function make(){const name=$('name').value.trim();if(name.length<2)return notify('Введите имя от 2 символов');state=fresh(name.slice(0,32));tab='home';done('Добро пожаловать в новую жизнь!')}
function study(){sync();if(state.education>=3)return notify('Обучение завершено');if(state.energy<20)return notify('Не хватает энергии');const cost=state.education===0?0:state.education===1?150:350;if(state.cash<cost)return notify('Не хватает денег');state.cash-=cost;state.energy-=20;state.study++;if(cost)record('Обучение',-cost);if(state.study>=5){state.study=0;state.education++;state.reputation+=5;done('Новый уровень образования!')}else done('Занятие завершено')}
function hire(i){sync();const j=jobs[i];if(state.age<18)return notify('Работа доступна с 18 лет');if(state.education<j.edu||state.reputation<j.rep)return notify('Недостаточно квалификации или репутации');state.job=i;state.reputation+=2;done('Вы устроились на работу')}
function buy(i){sync();const g=goods[i];if(state.cash<g[1])return notify('Недостаточно денег');state.cash-=g[1];state.owned.push(g[0]);state.reputation++;record('Покупка: '+g[0],-g[1]);done('Покупка совершена')}
function transfer(toBank){sync();const n=Number($('amount').value);if(!Number.isSafeInteger(n)||n<=0)return notify('Введите положительную целую сумму');if(toBank){if(state.cash<n)return notify('Недостаточно наличных');state.cash-=n;state.bank+=n;record('Внесено на счёт',-n)}else{if(state.bank<n)return notify('Недостаточно средств на счёте');state.bank-=n;state.cash+=n;record('Снято со счёта',n)}done('Перевод выполнен')}
function home(){const progress=state.education>=2?100:Math.round(((state.education*5+state.study)/10)*100);return `<div class="hero"><div class="hero-head"><div class="portrait">🧑🏻</div><div class="hero-info"><h1>${esc(state.name)} ✎</h1><p>${state.age} лет · ${state.age<18?'Студент':state.job<0?'В поиске работы':jobs[state.job].name}</p><div class="tiny-row"><span>🎓 Образование</span><strong>${state.education<2?'Экономический колледж':state.education===2?'Колледж окончен':'Университет'}</strong></div><div class="tiny-row"><span>🏠 Жильё</span><strong>Общежитие</strong></div><div class="tiny-row"><span>👪 Семья</span><strong>Не женат / не замужем</strong></div></div></div></div><div class="money-grid"><div class="panel money-card"><div class="money-icon">💚</div><div class="caption">Игровой баланс</div><div class="money-value">${fmt(state.cash)}</div><button class="btn primary full" onclick="go('bank')">Пополнить</button></div><div class="panel money-card"><div class="money-icon">🪙</div><div class="caption">Доступно к выводу</div><div class="money-value gold">0 ₴</div><button class="btn full" onclick="notify('Реальные выплаты пока не подключены')">Вывести</button></div></div><div class="panel"><div class="study"><div class="big-icon">📖</div><div style="flex:1;min-width:0"><div class="row"><b>Обучение</b><span class="caption">${progress}%</span></div><div class="sub">${state.education<2?'Экономический колледж':edus[state.education]}</div><div class="bar"><div style="width:${progress}%"></div></div><div class="progress-note">${state.education<2?'Стипендия и выпуск — в будущих обновлениях':'Доступны следующие уровни обучения'}</div></div></div><button class="btn full" onclick="go('education')">Задания и прогресс ›</button></div><div class="action-grid"><button class="tile" onclick="go('work')"><span class="tile-icon" style="background:#704326">💼</span><span><b>Работа</b><small>Трудоустройство</small></span><span class="chev">›</span></button><button class="tile" onclick="go('education')"><span class="tile-icon" style="background:#224f9a">🎓</span><span><b>Учёба</b><small>Задания</small></span><span class="chev">›</span></button><button class="tile" onclick="go('shop')"><span class="tile-icon" style="background:#8a304b">🛒</span><span><b>Магазин</b><small>Еда и вещи</small></span><span class="chev">›</span></button><button class="tile" onclick="go('bank')"><span class="tile-icon" style="background:#096b5a">🏦</span><span><b>Банк</b><small>Переводы</small></span><span class="chev">›</span></button></div><div class="panel" style="margin-top:12px"><div class="row"><h2 class="panel-title">📰 Новости Республики</h2><span class="caption">Лента</span></div><div class="news"><div class="news-photo"></div><div><b>Добро пожаловать в Республику!</b><p>Ваша история начинается сегодня. Создавайте карьеру и развивайте персонажа.</p><span class="caption">Игровая новость</span></div></div></div><p class="caption">⏱️ Время идёт автоматически: 1 игровой день = 15 реальных минут. Кнопки «Следующий день» нет.</p>`}
function profile(){const inc=state.transactions.filter(x=>x.amount>0).reduce((s,x)=>s+x.amount,0),out=-state.transactions.filter(x=>x.amount<0).reduce((s,x)=>s+x.amount,0);return `<div class="panel"><h2 class="panel-title">👤 Профиль</h2>${stat('Имя',esc(state.name))}${stat('Возраст',state.age+' лет')}${stat('Игровой день',state.day)}${stat('Репутация',state.reputation+' ★')}${stat('Капитал',fmt(state.cash+state.bank))}<details><summary>💼 Карьера</summary>${stat('Работа',state.job<0?'Нет':jobs[state.job].name)}${stat('Всего заработано',fmt(state.salaryEarned))}</details><details><summary>💰 Финансы</summary>${stat('Наличные',fmt(state.cash))}${stat('Банковский счёт',fmt(state.bank))}${stat('Доходы по истории',fmt(inc))}${stat('Расходы по истории',fmt(out))}${state.transactions.slice(0,15).map(x=>stat('День '+x.day+' · '+esc(x.label),(x.amount>0?'+':'')+fmt(x.amount))).join('')}</details><details><summary>🎓 Образование</summary>${stat('Уровень',edus[state.education])}${stat('Занятия',state.study+'/5')}</details><details><summary>🏠 Имущество</summary>${state.owned.length?state.owned.map(x=>`<div class="item">${esc(x)}</div>`).join(''):'<p class="empty">Пока нет имущества</p>'}</details><details><summary>👪 Семья</summary><p class="empty">Семья и наследование появятся позже.</p></details></div><div class="panel"><button class="btn full" onclick="resetGame()">Начать новую жизнь</button></div>`}
function education(){return `<div class="panel"><h2 class="panel-title">🎓 Учёба</h2>${stat('Образование',edus[state.education])}${stat('Энергия',state.energy+'/100')}${stat('Занятия',state.study+'/5')}<div class="bar"><div style="width:${state.study*20}%"></div></div><p class="muted">Учитесь, чтобы открывать новые профессии. Энергия восстанавливается автоматически.</p><button class="btn primary full" ${state.education>=3?'disabled':''} onclick="study()">Посетить занятие · ${fmt(state.education===0?0:state.education===1?150:350)}</button></div>`}
function work(){return `<div class="panel"><h2 class="panel-title">💼 Работа</h2>${stat('Возраст',state.age+' лет')}${stat('Репутация',state.reputation+' ★')}${stat('Текущая должность',state.job<0?'Безработный':jobs[state.job].name)}<p class="muted">Зарплата начисляется автоматически с каждым игровым днём. Для устройства на работу нужно достичь 18 лет.</p></div><div class="panel">${jobs.map((j,i)=>`<div class="item"><div class="row"><h3>${j.name}</h3><span class="pill">${fmt(j.pay)}/день</span></div><p>Образование: ${j.edu} · Репутация: ${j.rep}+</p><button class="btn small" ${state.job===i||state.age<18||state.education<j.edu||state.reputation<j.rep?'disabled':''} onclick="hire(${i})">${state.job===i?'Вы работаете здесь':'Устроиться'}</button></div>`).join('')}</div>`}
function shop(){return `<div class="panel"><h2 class="panel-title">🛒 Магазин</h2>${stat('Наличные',fmt(state.cash))}</div><div class="panel">${goods.map((g,i)=>`<div class="item"><div class="row"><h3>${g[0]}</h3><span class="pill">${fmt(g[1])}</span></div><p>${g[2]}</p><button class="btn small" ${state.cash<g[1]?'disabled':''} onclick="buy(${i})">Купить</button></div>`).join('')}</div>`}
function bank(){return `<div class="panel"><h2 class="panel-title">🏦 Банк</h2><div class="money-value">${fmt(state.bank)}</div>${stat('Наличные',fmt(state.cash))}</div><div class="panel"><h3>Перевод между своими счетами</h3><input id="amount" type="number" min="1" step="1" placeholder="Сумма в ₴"><div class="row"><button class="btn primary" onclick="transfer(true)">Внести</button><button class="btn" onclick="transfer(false)">Снять</button></div><p class="caption">Это только игровые средства, без реальных платежей.</p></div>`}
function placeholder(t){return `<div class="panel"><h2 class="panel-title">${t}</h2><p class="muted">Раздел готовится для многопользовательской версии. Здесь появятся реальные игроки и общий мир после подключения сервера.</p></div>`}function resetGame(){if(confirm('Удалить персонажа и прогресс на этом устройстве?')){localStorage.removeItem(KEY);state=null;tab='home';render()}}
const pages={home:['🏠','Главная',home],profile:['👤','Профиль',profile],chat:['👥','Общение',()=>placeholder('👥 Общение')],map:['🗺️','Карта',()=>placeholder('🗺️ Карта')],awards:['🏆','Достижения',()=>placeholder('🏆 Достижения')]};function render(){const root=$('app'),nav=$('nav');if(!state){nav.style.display='none';root.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><span class="crown">👑</span><div><b>НОВАЯ ЖИЗНЬ</b><div class="sub">Твой путь. Твоя история.</div></div></div></div><div class="panel" style="margin-top:70px"><div style="text-align:center;font-size:65px">🌆</div><h2 style="text-align:center">Создай свою историю</h2><p class="muted" style="text-align:center">Начни жизнь в Республике в 16 лет. Учись, работай, зарабатывай и строй будущее.</p><label class="caption">Имя персонажа</label><input id="name" maxlength="32" placeholder="Имя и фамилия"><button class="btn primary full" onclick="make()">Начать жизнь</button></div></div>`;return}sync();nav.style.display='flex';const inner=tab in pages?pages[tab][2]():({education,work,shop,bank}[tab]||home)();root.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><span class="crown">👑</span><div><b>НОВАЯ ЖИЗНЬ</b><div class="sub">Твой путь. Твоя история.</div></div></div><div class="clock">☀️ <span id="clock"></span><div class="sub">День ${state.day}</div></div></div>${inner}</div>`;nav.innerHTML=Object.entries(pages).map(([k,p])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')"><span class="ni">${p[0]}</span>${p[1]}</button>`).join('');$('clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}state=load();migrate();render();setInterval(()=>{if(!state)return;const old=state.day;sync();if(state.day!==old)render();else if($('clock'))$('clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})},15000);
</script></body></html>
