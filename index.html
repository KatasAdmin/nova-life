<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>НОВАЯ ЖИЗНЬ — 0.1</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef5ff;background:#08111e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#0d2034,#08111e 42%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:600px;margin:auto;min-height:100vh;padding-bottom:88px}.hero{padding:25px 20px 32px;background:linear-gradient(115deg,#081524d9,#122f48b8),radial-gradient(circle at 90% 10%,#6093b6,transparent 55%);border-radius:0 0 24px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:22px;letter-spacing:.4px}.subtitle{color:#a6bdd3;font-size:12px;margin-top:3px}.clock{font-size:12px;color:#b7cadf;text-align:right}.content{padding:16px}.card{background:#111e2d;border:1px solid #25384c;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px #00000015}.identity{display:flex;align-items:center;gap:14px}.avatar{width:62px;height:62px;border-radius:16px;background:linear-gradient(145deg,#2d587c,#182d48);display:grid;place-items:center;font-size:32px;flex-shrink:0}.name{font-size:20px;font-weight:800}.muted{color:#9fb3c9;font-size:13px}.money{font-size:26px;font-weight:850;color:#65e2a7;margin:8px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:1px solid #294158;border-radius:16px;background:#15283d;color:#f1f7ff;text-align:left;padding:16px;min-height:94px}.action .ico{font-size:26px;display:block;margin-bottom:8px}.action strong{font-size:16px}.action small{display:block;color:#a9bcd0;margin-top:4px}.section-title{font-size:17px;font-weight:800;margin:20px 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{padding:5px 9px;border-radius:9px;background:#1a3a53;color:#b7d8fa;font-size:12px}.progress{height:9px;border-radius:20px;background:#2a394c;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#40d29b;border-radius:20px;transition:width .2s}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:600px;width:100%;display:flex;background:#0d1928f5;border-top:1px solid #2b4056;padding:10px 5px max(10px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;border:0;color:#9eafc7;flex:1;font-size:11px;display:grid;gap:4px;justify-items:center}.nav button span{font-size:23px}.nav button.active{color:#6aa9ff}.btn{background:#2369b4;border:0;border-radius:12px;color:white;padding:12px 15px;font-weight:700}.btn.secondary{background:#24394f}.btn:disabled{opacity:.4;cursor:not-allowed}.field{display:block;width:100%;background:#0b1828;color:white;border:1px solid #35506a;border-radius:12px;padding:12px;margin:8px 0 14px}.label{font-size:13px;color:#b9cadd}.detail{border:1px solid #273d52;border-radius:14px;margin-bottom:10px;overflow:hidden}.detail>button{background:#132438;border:0;color:white;width:100%;text-align:left;padding:17px;display:flex;justify-content:space-between;align-items:center;font-weight:750}.detail .inside{padding:14px;background:#0e1c2b;border-top:1px solid #273d52}.line{padding:9px 0;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #223347;font-size:14px}.line:last-child{border:0}.green{color:#63e2a1}.red{color:#ff7f86}.note{font-size:12px;color:#91a8c0;line-height:1.55}.hide{display:none}.feed{padding:10px 0;border-bottom:1px solid #263b50;font-size:13px}.feed:last-child{border:0}.empty{text-align:center;padding:26px;color:#a7b8cd}.small{font-size:12px}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#204f4a;color:#fff;padding:11px 18px;border-radius:12px;z-index:10;max-width:90%;text-align:center;box-shadow:0 8px 25px #0008}
</style></head><body><div class="app"><header class="hero"><div class="top"><div><div class="brand">👑 НОВАЯ ЖИЗНЬ</div><div class="subtitle">Твой путь. Твоя история.</div></div><div class="clock" id="clock"></div></div></header><main class="content" id="view"></main><nav class="nav" id="nav"></nav></div><script>
const VERSION=1,KEY='nova_life_v01';const professions=[{id:'economy',title:'Экономический колледж',job:'Помощник бухгалтера'},{id:'medicine',title:'Медицинский колледж',job:'Медицинский ассистент'},{id:'it',title:'IT-колледж',job:'Младший разработчик'},{id:'law',title:'Юридический колледж',job:'Помощник юриста'}];const dayMs=15*60*1000; // 1 реальный час = 4 игровых дня
const fresh=()=>({schemaVersion:VERSION,account:{id:crypto.randomUUID?.()||String(Date.now()),createdAt:Date.now(),premiumBalanceKop:0},characters:[],activeCharacterId:null,world:{day:1,lastTick:Date.now()},ledger:[],events:[],families:[],businesses:[],government:{elections:[],laws:[]}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}if(!db.world)db=fresh();let page='home',expanded='',toastTimer;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const character=()=>db.characters.find(c=>c.id===db.activeCharacterId);const cash=n=>(n/100).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₴';const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const record=(c,amount,kind,title)=>{c.walletKop+=amount;db.ledger.unshift({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),characterId:c.id,amount,kind,title,day:db.world.day});db.ledger=db.ledger.slice(0,1000)};const age=c=>16+Math.floor((db.world.day-c.birthDay)/365);const course=c=>Math.min(2,Math.floor((db.world.day-c.birthDay)/365)+1);const graduate=c=>db.world.day-c.birthDay>=730;const elapsedDays=()=>Math.max(0,Math.floor((Date.now()-db.world.lastTick)/dayMs));
function tick(){const days=elapsedDays();if(!days)return;const apply=Math.min(days,5000);for(let d=0;d<apply;d++){db.world.day++;for(const c of db.characters){if(c.status!=='alive')continue;if(!graduate(c))record(c,1500,'stipend','Стипендия');if(c.job)record(c,c.job.salaryKop,'salary','Зарплата: '+c.job.title);record(c,-1200,'living','Расходы на проживание')}}db.world.lastTick+=apply*dayMs;save()}
function notify(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2500)}function go(p){page=p;expanded='';render()}function nav(){document.getElementById('nav').innerHTML=[['home','🏠','Главная'],['profile','👤','Профиль'],['social','👥','Общение'],['map','🗺️','Карта'],['achievements','🏆','Достижения']].map(([id,ico,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${name}</button>`).join('')}
function create(){const name=document.getElementById('person-name').value.trim();const edu=document.getElementById('person-edu').value;if(name.length<2||name.length>50)return notify('Имя: от 2 до 50 символов');const c={id:crypto.randomUUID?.()||String(Date.now()),name,birthDay:db.world.day,status:'alive',education:edu,job:null,walletKop:15000,reputation:{general:50,work:50,finance:50,social:50},experience:0,home:'Общежитие',familyId:null,parents:[],children:[],skills:{health:100,energy:100},inventory:[]};db.characters.push(c);db.activeCharacterId=c.id;db.events.unshift({characterId:c.id,day:db.world.day,type:'character.created',text:'Создан персонаж'});save();go('home')}
function register(){return `<div class="card"><h2>Начни свою историю</h2><p class="muted">Создай первого персонажа. Тебе 16 лет, впереди учёба, работа и целая жизнь.</p><label class="label">Имя и фамилия</label><input class="field" id="person-name" maxlength="50" placeholder="Например, Александр Коваленко"><label class="label">Выбери образование</label><select class="field" id="person-edu">${professions.map(p=>`<option value="${p.id}">${p.title}</option>`).join('')}</select><button class="btn" onclick="create()">Начать жизнь</button></div>`}
function summary(c){return `<div class="card identity"><div class="avatar">👤</div><div><div class="name">${escapeHtml(c.name)}</div><div class="muted">${age(c)} лет · ${graduate(c)?(c.job?.title||'Выпускник'):'Студент'}</div><div class="muted">🏠 ${c.home}</div></div></div>`}
function school(c){const p=professions.find(p=>p.id===c.education),progress=Math.min(100,Math.floor((db.world.day-c.birthDay)/730*100));return `<div class="card"><div class="row"><strong>🎓 Обучение</strong><span class="pill">${graduate(c)?'Завершено':course(c)+'-й курс (из 2)'}</span></div><p class="muted">${p.title}</p><div class="progress"><div style="width:${progress}%"></div></div><div class="row"><span class="muted">${graduate(c)?'Диплом получен':'Стипендия: +15 ₴/день'}</span><strong>${progress}%</strong></div></div>`}
function home(c){return `${summary(c)}<div class="grid"><div class="card"><div class="muted">Игровой баланс</div><div class="money">${cash(c.walletKop)}</div></div><div class="card"><div class="muted">Доступно к выводу</div><div class="money" style="color:#f6ce6e">0 ₴</div><div class="note">Недоступно в демо</div></div></div>${school(c)}<div class="section-title">Чем займёмся?</div><div class="grid"><button class="action" onclick="go('work')"><span class="ico">💼</span><strong>Работа</strong><small>Вакансии и трудоустройство</small></button><button class="action" onclick="go('study')"><span class="ico">🎓</span><strong>Учёба</strong><small>Прогресс обучения</small></button><button class="action" onclick="go('shop')"><span class="ico">🛍️</span><strong>Магазин</strong><small>Товары и услуги</small></button><button class="action" onclick="go('bank')"><span class="ico">🏦</span><strong>Банк</strong><small>Финансы и переводы</small></button></div><div class="card" style="margin-top:16px"><strong>📰 Новости Республики</strong><p class="muted">В Республике открыты первые колледжи. Студенты получают стипендии, а выпускники могут устраиваться на работу.</p></div>`}
function lines(items){return items.map(([a,b])=>`<div class="line"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')};function section(id,icon,title,body){return `<div class="detail"><button onclick="toggle('${id}')"><span>${icon} &nbsp;${title}</span><span>${expanded===id?'⌃':'⌄'}</span></button>${expanded===id?`<div class="inside">${body}</div>`:''}</div>`}function toggle(id){expanded=expanded===id?'':id;render()}
function profile(c){const transactions=db.ledger.filter(x=>x.characterId===c.id),today=transactions.filter(x=>x.day===db.world.day),income=today.filter(x=>x.amount>0).reduce((a,x)=>a+x.amount,0),cost=-today.filter(x=>x.amount<0).reduce((a,x)=>a+x.amount,0),edu=professions.find(x=>x.id===c.education);return `${summary(c)}<div class="card"><div class="row"><span>⭐ Рейтинг</span><strong>${c.reputation.general}/100</strong></div><div class="progress"><div style="width:${c.reputation.general}%;background:#5199ff"></div></div></div><div class="section-title">Мой профиль</div>${section('finance','💰','Финансы',lines([['Баланс',cash(c.walletKop)],['Доход сегодня',`<span class="green">+${cash(income)}</span>`],['Расход сегодня',`<span class="red">−${cash(cost)}</span>`]])+`<h4>Последние операции</h4>${transactions.slice(0,8).map(x=>`<div class="line"><span>${escapeHtml(x.title)} · день ${x.day}</span><strong class="${x.amount>=0?'green':'red'}">${x.amount>=0?'+':'−'}${cash(Math.abs(x.amount))}</strong></div>`).join('')||'<p class="muted">Операций пока нет</p>'}`)}${section('career','💼','Карьера',lines([['Должность',escapeHtml(c.job?.title||'Не работает')],['Опыт',c.experience+' очков'],['Трудовая репутация',c.reputation.work+'/100']]))}${section('education','🎓','Образование',lines([['Учебное заведение',edu.title],['Статус',graduate(c)?'Диплом получен':course(c)+'-й курс'],['Будущая профессия',edu.job]]))}${section('property','🏠','Имущество',lines([['Жильё',c.home],['Транспорт','Нет'],['Бизнес','Нет']]))}${section('family','👨‍👩‍👧','Семья',`<p class="muted">Семейное положение: не женат / не замужем</p><p class="note">Дети, брак, наследство и семейные династии появятся в следующих версиях. Связи персонажей предусмотрены в структуре данных.</p>`)}${section('reputation','⭐','Репутация',lines([['Общая',c.reputation.general+'/100'],['Трудовая',c.reputation.work+'/100'],['Финансовая',c.reputation.finance+'/100'],['Общественная',c.reputation.social+'/100']]))}${section('history','📜','История',db.events.filter(e=>e.characterId===c.id).map(e=>`<div class="feed">День ${e.day}: ${escapeHtml(e.text)}</div>`).join('')||'Пока пусто')}`}
function hire(id){const c=character();if(!graduate(c))return notify('Для этой должности нужен диплом');const edu=professions.find(p=>p.id===c.education);if(id!==c.education)return notify('Нужна соответствующая специальность');if(c.job)return notify('Вы уже работаете');c.job={id,title:edu.job,salaryKop:2500};c.reputation.work=Math.min(100,c.reputation.work+2);c.reputation.general=Math.min(100,c.reputation.general+1);db.events.unshift({characterId:c.id,day:db.world.day,type:'career.hired',text:'Трудоустройство: '+edu.job});save();render();notify('Вы устроились на работу!')}
function work(c){const p=professions.find(p=>p.id===c.education);return `<div class="section-title">💼 Работа</div><div class="card"><h3>${c.job?'Текущая работа':'Доступная вакансия'}</h3><p>${c.job?.title||p.job}</p><p class="muted">Зарплата: +25 ₴ за игровой день</p><p class="muted">${graduate(c)?'Диплом получен':'Требуется окончить двухлетнее обучение'}</p><button class="btn" ${!graduate(c)||c.job?'disabled':''} onclick="hire('${p.id}')">${c.job?'Вы трудоустроены':'Устроиться'}</button></div><p class="note">Позже появятся работодатели-игроки, трудовые договоры, повышения и зарплаты от предприятий.</p>`}
function shop(c){return `<div class="section-title">🛍️ Магазин</div><div class="card"><h3>Продукты</h3><p class="muted">Набор продуктов — 8 ₴</p><button class="btn" onclick="buyFood()">Купить за 8 ₴</button></div><p class="note">На старте покупка записывается в историю расходов. Инвентарь и рынок игроков добавим позже.</p>`}function buyFood(){const c=character();if(c.walletKop<800)return notify('Недостаточно средств');record(c,-800,'purchase','Покупка продуктов');save();render();notify('Покупка совершена')}
function bank(c){return `<div class="section-title">🏦 Банк</div><div class="card"><div class="muted">Игровой баланс</div><div class="money">${cash(c.walletKop)}</div><p class="note">Это игровые деньги. Их нельзя вывести в реальные гривны.</p></div><div class="card"><strong>Реальные платежи</strong><p class="muted">Пополнение и вывод недоступны в прототипе. Позже подключим отдельный платёжный модуль с проверками и учётом.</p></div>`}
function study(c){return `<div class="section-title">🎓 Учёба</div>${school(c)}<div class="card"><p>Будущая профессия: <strong>${professions.find(x=>x.id===c.education).job}</strong></p><p class="note">Обучение идёт автоматически по игровому календарю. 1 реальный час = 4 игровых дня.</p></div>`}
function placeholder(title,desc){return `<div class="section-title">${title}</div><div class="card"><p class="muted">${desc}</p><p class="note">Этот модуль подключим после проверки базовой версии.</p></div>`}
function render(){tick();const c=character();document.getElementById('clock').innerHTML=`☀️ Игровой день ${db.world.day}<br><span class="muted">1 час = 4 дня</span>`;nav();document.getElementById('view').innerHTML=!c?register():({home:()=>home(c),profile:()=>profile(c),work:()=>work(c),study:()=>study(c),shop:()=>shop(c),bank:()=>bank(c),social:()=>placeholder('👥 Общение','Знакомства и взаимодействия с другими игроками.'),map:()=>placeholder('🗺️ Карта','Районы, недвижимость и предприятия.'),achievements:()=>placeholder('🏆 Достижения','История успехов и награды персонажа.')})[page]?.()||home(c)}render();setInterval(()=>{const old=db.world.day;tick();if(old!==db.world.day)render()},30000);
</script></body></html>
